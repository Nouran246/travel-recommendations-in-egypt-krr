<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="travel.css">
</head>
<body>
    <header>
  <div class="logo">
    <span class="logo-eyebrow">AI-Powered Travel</span>
    <h1 class="logo-title">Discover <em>Egypt</em></h1>
  </div>
  <span class="header-deco">Your personal travel advisor</span>
</header>
 
<div class="container">
 
  <!-- MODE SELECTOR -->
  <div class="mode-section">
    <div class="mode-label">Choose your journey</div>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="1">Recommend Egypt</button>
      <button class="mode-tab" data-mode="2">Specific Cities</button>
      <button class="mode-tab" data-mode="3">Build Itinerary</button>
      <button class="mode-tab" data-mode="4">Budget Explorer</button>
    </div>
  </div>
 
  <div class="divider"></div>
 
  <!-- FORMS -->
  <div id="form-area"></div>
 
  <!-- RESULTS -->
  <div id="results"></div>
 
</div>

</body>
</html>
